# Alembic configuration file.

[alembic]
# Path to migration scripts
script_location = alembic

# SQLAlchemy URL — overridden at runtime by env.py from app settings
sqlalchemy.url = postgresql+asyncpg://contabilidad:contabilidad_secret@localhost:5432/sistema_contable

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
